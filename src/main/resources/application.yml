# MusiCat Application Configuration
spring:
  application:
    name: MusiCat

  datasource:
    url: jdbc:h2:mem:test
    username: root
    password:

  jpa:
    #    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
  #        format_sql: true

  # Flyway configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.mtovar.musicat: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.connections.pooling: WARN
#    org.flywaydb: DEBUG

#    TRACE - most detailed, for fine-grained debugging
#    DEBUG - debugging information
#    INFO - general informational messages
#    WARN - potential issues that don't stop execution
#    ERROR - errors that allow continued execution
#    FATAL - severe errors that may cause application termination
#    OFF - completely disables logging
